# Workflow for testing SAP Development Tech Radar: lint, unit tests, the
# definitions/**/*.toml -> JSON/HTML conversion, and the Vue app build.
# This is a check only - it never deploys anything (see techradar.yml for
# the GitHub Pages deploy, which only runs on a published release).
name: Test SAP Development Tech Radar

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # history.js derives release history from git tags and reads
          # definitions/**/*.toml as it existed at each tag (git show/git
          # ls-tree) - it needs the full history and all tags, not a
          # shallow clone, for both the conversion and its own tests to
          # work the way they do outside CI.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Convert definitions/**/*.toml to JSON/HTML
        run: npm run conv

      - name: Setup Node for the app
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm ci
        working-directory: ./app

      - name: Build Vue app
        run: npm run build
        working-directory: ./app
