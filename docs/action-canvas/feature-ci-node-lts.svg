<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 820" width="1160" height="820" font-family="Inter, 'DejaVu Sans', Arial, Helvetica, sans-serif">
<rect width="1160" height="820" fill="#f3f4f8"/>
<text x="20.0" y="34.0" font-size="11.5" fill="#64748b" font-weight="bold" letter-spacing="2.4">ACTION CANVAS</text>
<text x="20.0" y="62.0" font-size="25" fill="#1e293b" font-weight="bold">Run CI on Node.js 24 LTS and require it for local builds</text>
<rect x="20.0" y="85.0" width="362.7" height="169" rx="16" fill="#0f172a" fill-opacity="0.025"/><rect x="20.0" y="83.0" width="362.7" height="169" rx="16" fill="#0f172a" fill-opacity="0.035"/><rect x="20.0" y="82.0" width="362.7" height="169" rx="16" fill="white"/><rect x="20.0" y="98.0" width="4" height="137" rx="2" fill="#16a34a"/><circle cx="50.0" cy="109" r="13" fill="#dcfce7"/><text x="50.0" y="114.0" font-size="13" fill="#16a34a" font-weight="bold" text-anchor="middle">4</text><text x="72.0" y="115.0" font-size="17" fill="#1e293b" font-weight="bold">Added Value</text><circle cx="43.0" cy="142.3" r="2.6" fill="#16a34a"/><text x="53.0" y="146.0" font-size="11.5" fill="#1e293b">CI and deploy run on a supported Node 24 LTS</text><text x="53.0" y="162.1" font-size="11.5" fill="#1e293b">release; 24.x patch updates arrive automatically.</text><circle cx="43.0" cy="174.5" r="2.6" fill="#16a34a"/><text x="53.0" y="178.2" font-size="11.5" fill="#1e293b">Contributors get a clear error on `npm i` instead</text><text x="53.0" y="194.3" font-size="11.5" fill="#1e293b">of obscure build failures on an old Node.</text><circle cx="43.0" cy="206.7" r="2.6" fill="#16a34a"/><text x="53.0" y="210.4" font-size="11.5" fill="#1e293b">Same Node major for CI, deploy and local builds.</text>
<rect x="398.7" y="85.0" width="362.7" height="169" rx="16" fill="#0f172a" fill-opacity="0.025"/><rect x="398.7" y="83.0" width="362.7" height="169" rx="16" fill="#0f172a" fill-opacity="0.035"/><rect x="398.7" y="82.0" width="362.7" height="169" rx="16" fill="white"/><rect x="398.7" y="98.0" width="4" height="137" rx="2" fill="#7c3aed"/><circle cx="428.7" cy="109" r="13" fill="#ede9fe"/><text x="428.7" y="114.0" font-size="13" fill="#7c3aed" font-weight="bold" text-anchor="middle">5</text><text x="450.7" y="115.0" font-size="17" fill="#1e293b" font-weight="bold">Stakeholders</text><circle cx="421.7" cy="142.3" r="2.6" fill="#7c3aed"/><text x="431.7" y="146.0" font-size="11.5" fill="#1e293b">Involved: repository owner (merges and tags</text><text x="431.7" y="162.1" font-size="11.5" fill="#1e293b">releases)</text><circle cx="421.7" cy="174.5" r="2.6" fill="#7c3aed"/><text x="431.7" y="178.2" font-size="11.5" fill="#1e293b">Affected: all contributors who build locally, the</text><text x="431.7" y="194.3" font-size="11.5" fill="#1e293b">GitHub Pages deploy workflow</text><circle cx="421.7" cy="206.7" r="2.6" fill="#7c3aed"/><text x="431.7" y="210.4" font-size="11.5" fill="#1e293b">(Assumption) Content contributors who only edit</text><text x="431.7" y="226.5" font-size="11.5" fill="#1e293b">TOML also run `npm i` and need Node 24 or newer.</text>
<rect x="777.3" y="85.0" width="362.7" height="169" rx="16" fill="#0f172a" fill-opacity="0.025"/><rect x="777.3" y="83.0" width="362.7" height="169" rx="16" fill="#0f172a" fill-opacity="0.035"/><rect x="777.3" y="82.0" width="362.7" height="169" rx="16" fill="white"/><rect x="777.3" y="98.0" width="4" height="137" rx="2" fill="#2563eb"/><circle cx="807.3" cy="109" r="13" fill="#dbeafe"/><text x="807.3" y="114.0" font-size="13" fill="#2563eb" font-weight="bold" text-anchor="middle">6</text><text x="829.3" y="115.0" font-size="17" fill="#1e293b" font-weight="bold">IT</text><circle cx="800.3" cy="143.1" r="2.6" fill="#2563eb"/><text x="810.3" y="146.0" font-size="9" fill="#1e293b">GitHub Actions workflows `ci.yml` and `techradar.yml`</text><text x="810.3" y="158.6" font-size="9" fill="#1e293b">(`actions/setup-node@v4`)</text><circle cx="800.3" cy="168.3" r="2.6" fill="#2563eb"/><text x="810.3" y="171.2" font-size="9" fill="#1e293b">npm with `package.json`/`package-lock.json` at the root and in</text><text x="810.3" y="183.8" font-size="9" fill="#1e293b">`app/`</text><circle cx="800.3" cy="193.5" r="2.6" fill="#2563eb"/><text x="810.3" y="196.4" font-size="9" fill="#1e293b">Vite 8 and Vue 3 app in `app/` (requires Node ^20.19 or</text><text x="810.3" y="209.0" font-size="9" fill="#1e293b">&gt;=22.12)</text><circle cx="800.3" cy="218.7" r="2.6" fill="#2563eb"/><text x="810.3" y="221.6" font-size="9" fill="#1e293b">GitHub's node-versions manifest: `24` currently resolves to</text><text x="810.3" y="234.2" font-size="9" fill="#1e293b">Node 24.22.3 (LTS Krypton)</text>
<rect x="20.0" y="270.0" width="279.0" height="370" rx="16" fill="#0f172a" fill-opacity="0.025"/><rect x="20.0" y="268.0" width="279.0" height="370" rx="16" fill="#0f172a" fill-opacity="0.035"/><rect x="20.0" y="267.0" width="279.0" height="370" rx="16" fill="white"/><rect x="20.0" y="283.0" width="4" height="338" rx="2" fill="#ea580c"/><circle cx="50.0" cy="294" r="13" fill="#ffedd5"/><text x="50.0" y="299.0" font-size="13" fill="#ea580c" font-weight="bold" text-anchor="middle">9</text><text x="72.0" y="300.0" font-size="17" fill="#1e293b" font-weight="bold">Implementation</text><text x="42.0" y="327.0" font-size="14" fill="#1e293b" font-weight="bold">Time Horizon</text><text x="277.0" y="327.0" font-size="14" fill="#2563eb" font-weight="bold" text-anchor="end">1/5</text><rect x="42.0" y="335.0" width="42.6" height="9" rx="4.5" fill="#93c5fd"/><rect x="90.1" y="335.0" width="42.6" height="9" rx="4.5" fill="#e8eaf0"/><rect x="138.2" y="335.0" width="42.6" height="9" rx="4.5" fill="#e8eaf0"/><rect x="186.3" y="335.0" width="42.6" height="9" rx="4.5" fill="#e8eaf0"/><rect x="234.4" y="335.0" width="42.6" height="9" rx="4.5" fill="#e8eaf0"/><text x="42.0" y="357.5" font-size="9" fill="#94a3b8">short-term</text><text x="277.0" y="357.5" font-size="9" fill="#94a3b8" text-anchor="end">long-term</text><text x="42.0" y="373.0" font-size="11" fill="#1e293b">a few config lines, done within hours</text><text x="42.0" y="404.8" font-size="14" fill="#1e293b" font-weight="bold">Complexity</text><text x="277.0" y="404.8" font-size="14" fill="#16a34a" font-weight="bold" text-anchor="end">1/5</text><rect x="42.0" y="412.8" width="42.6" height="9" rx="4.5" fill="#22c55e"/><rect x="90.1" y="412.8" width="42.6" height="9" rx="4.5" fill="#e8eaf0"/><rect x="138.2" y="412.8" width="42.6" height="9" rx="4.5" fill="#e8eaf0"/><rect x="186.3" y="412.8" width="42.6" height="9" rx="4.5" fill="#e8eaf0"/><rect x="234.4" y="412.8" width="42.6" height="9" rx="4.5" fill="#e8eaf0"/><text x="42.0" y="435.3" font-size="9" fill="#94a3b8">low</text><text x="277.0" y="435.3" font-size="9" fill="#94a3b8" text-anchor="end">high</text><text x="42.0" y="450.8" font-size="11" fill="#1e293b">version strings and metadata, no code</text><text x="42.0" y="463.8" font-size="11" fill="#1e293b">changes</text><text x="42.0" y="482.6" font-size="14" fill="#1e293b" font-weight="bold">Cost</text><text x="277.0" y="482.6" font-size="14" fill="#16a34a" font-weight="bold" text-anchor="end">1/5</text><rect x="42.0" y="490.6" width="42.6" height="9" rx="4.5" fill="#22c55e"/><rect x="90.1" y="490.6" width="42.6" height="9" rx="4.5" fill="#e8eaf0"/><rect x="138.2" y="490.6" width="42.6" height="9" rx="4.5" fill="#e8eaf0"/><rect x="186.3" y="490.6" width="42.6" height="9" rx="4.5" fill="#e8eaf0"/><rect x="234.4" y="490.6" width="42.6" height="9" rx="4.5" fill="#e8eaf0"/><text x="42.0" y="513.1" font-size="9" fill="#94a3b8">low</text><text x="277.0" y="513.1" font-size="9" fill="#94a3b8" text-anchor="end">high</text><text x="42.0" y="528.6" font-size="11" fill="#1e293b">no licenses or infrastructure</text><text x="42.0" y="560.4" font-size="14" fill="#1e293b" font-weight="bold">Risk</text><text x="277.0" y="560.4" font-size="14" fill="#16a34a" font-weight="bold" text-anchor="end">1/5</text><rect x="42.0" y="568.4" width="42.6" height="9" rx="4.5" fill="#22c55e"/><rect x="90.1" y="568.4" width="42.6" height="9" rx="4.5" fill="#e8eaf0"/><rect x="138.2" y="568.4" width="42.6" height="9" rx="4.5" fill="#e8eaf0"/><rect x="186.3" y="568.4" width="42.6" height="9" rx="4.5" fill="#e8eaf0"/><rect x="234.4" y="568.4" width="42.6" height="9" rx="4.5" fill="#e8eaf0"/><text x="42.0" y="590.9" font-size="9" fill="#94a3b8">low</text><text x="277.0" y="590.9" font-size="9" fill="#94a3b8" text-anchor="end">high</text><text x="42.0" y="606.4" font-size="11" fill="#1e293b">Node 24 already used locally; CI</text><text x="42.0" y="619.4" font-size="11" fill="#1e293b">confirms on the PR</text>
<rect x="315" y="267" width="509" height="129" rx="16" fill="#0c2a4a"/>
<text x="339.0" y="298.0" font-size="11.5" fill="#7cc0f6" font-weight="bold" letter-spacing="1.8">1 · MEASURE</text>
<text x="339.0" y="330.0" font-size="22" fill="white" font-weight="bold">Node.js 24 LTS for CI and local</text><text x="339.0" y="358.6" font-size="22" fill="white" font-weight="bold">builds</text>
<rect x="315.0" y="415.0" width="246.5" height="225" rx="16" fill="#0f172a" fill-opacity="0.025"/><rect x="315.0" y="413.0" width="246.5" height="225" rx="16" fill="#0f172a" fill-opacity="0.035"/><rect x="315.0" y="412.0" width="246.5" height="225" rx="16" fill="white"/>
<text x="335.0" y="442.0" font-size="11" fill="#64748b" font-weight="bold" letter-spacing="1.6">2 · DESCRIPTION</text>
<circle cx="338.0" cy="462.5" r="2.6" fill="#1e293b"/><text x="348.0" y="466.0" font-size="11" fill="#1e293b">GitHub Actions (CI and Pages</text><text x="348.0" y="481.4" font-size="11" fill="#1e293b">deploy) installs Node 24 (LTS)</text><text x="348.0" y="496.8" font-size="11" fill="#1e293b">instead of the fixed Node 20.</text><circle cx="338.0" cy="508.7" r="2.6" fill="#1e293b"/><text x="348.0" y="512.2" font-size="11" fill="#1e293b">Local builds require the same</text><text x="348.0" y="527.6" font-size="11" fill="#1e293b">major: `engines` (&gt;=24) in both</text><text x="348.0" y="543.0" font-size="11" fill="#1e293b">`package.json` files, `.nvmrc`</text><text x="348.0" y="558.4" font-size="11" fill="#1e293b">(24), and `engine-strict` in</text><text x="348.0" y="573.8" font-size="11" fill="#1e293b">`.npmrc`.</text><circle cx="338.0" cy="585.7" r="2.6" fill="#1e293b"/><text x="348.0" y="589.2" font-size="11" fill="#1e293b">Goal: one Node version policy</text><text x="348.0" y="604.6" font-size="11" fill="#1e293b">for CI, deploy and contributors.</text>
<rect x="577.5" y="415.0" width="246.5" height="225" rx="16" fill="#0f172a" fill-opacity="0.025"/><rect x="577.5" y="413.0" width="246.5" height="225" rx="16" fill="#0f172a" fill-opacity="0.035"/><rect x="577.5" y="412.0" width="246.5" height="225" rx="16" fill="white"/>
<text x="597.5" y="442.0" font-size="11" fill="#64748b" font-weight="bold" letter-spacing="1.6">3 · BACKGROUND</text>
<circle cx="600.5" cy="462.5" r="2.6" fill="#1e293b"/><text x="610.5" y="466.0" font-size="11" fill="#1e293b">CI and deploy pin Node 20, which</text><text x="610.5" y="481.4" font-size="11" fill="#1e293b">reached end of life in April</text><text x="610.5" y="496.8" font-size="11" fill="#1e293b">2026 and gets no security fixes.</text><circle cx="600.5" cy="508.7" r="2.6" fill="#1e293b"/><text x="610.5" y="512.2" font-size="11" fill="#1e293b">Local development already runs a</text><text x="610.5" y="527.6" font-size="11" fill="#1e293b">different major version (Node</text><text x="610.5" y="543.0" font-size="11" fill="#1e293b">24), so CI does not test what</text><text x="610.5" y="558.4" font-size="11" fill="#1e293b">contributors use.</text><circle cx="600.5" cy="570.3" r="2.6" fill="#1e293b"/><text x="610.5" y="573.8" font-size="11" fill="#1e293b">Nothing stops a contributor from</text><text x="610.5" y="589.2" font-size="11" fill="#1e293b">building the app on an</text><text x="610.5" y="604.6" font-size="11" fill="#1e293b">unsupported Node version.</text>
<rect x="840.0" y="270.0" width="300.0" height="370" rx="16" fill="#0f172a" fill-opacity="0.025"/><rect x="840.0" y="268.0" width="300.0" height="370" rx="16" fill="#0f172a" fill-opacity="0.035"/><rect x="840.0" y="267.0" width="300.0" height="370" rx="16" fill="white"/><rect x="840.0" y="283.0" width="4" height="338" rx="2" fill="#4f46e5"/><circle cx="870.0" cy="294" r="13" fill="#e0e7ff"/><text x="870.0" y="299.0" font-size="13" fill="#4f46e5" font-weight="bold" text-anchor="middle">10</text><text x="892.0" y="300.0" font-size="17" fill="#1e293b" font-weight="bold">Activities</text><text x="862.0" y="316.0" font-size="10.5" fill="#64748b">What? Who? When?</text><text x="1117.0" y="326.0" font-size="10.5" fill="#64748b" text-anchor="end">5/7 done</text><rect x="862" y="330.5" width="255" height="5" rx="2.5" fill="#e8eaf0"/><rect x="862" y="330.5" width="182.1" height="5" rx="2.5" fill="#22c55e"/><circle cx="870" cy="359.5" r="8" fill="#22c55e"/><path d="M866.4,359.9 L869,362.5 L873.8,356.9" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="886.0" y="364.0" font-size="12.5" fill="#64748b">Set `node-version: "24"` in</text><text x="886.0" y="379.0" font-size="12.5" fill="#64748b">`ci.yml` (2 jobs) and…</text><text x="886.0" y="393.5" font-size="11" fill="#4f46e5">AI · next step</text><circle cx="870" cy="413.4" r="8" fill="#22c55e"/><path d="M866.4,413.8 L869,416.4 L873.8,410.8" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="886.0" y="417.9" font-size="12.5" fill="#64748b">Add `engines` (&gt;=24), `.nvmrc`</text><text x="886.0" y="432.9" font-size="12.5" fill="#64748b">and `.npmrc` (engine-strict) at…</text><text x="886.0" y="447.4" font-size="11" fill="#4f46e5">AI · next step</text><circle cx="870" cy="467.3" r="8" fill="#22c55e"/><path d="M866.4,467.7 L869,470.3 L873.8,464.7" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="886.0" y="471.8" font-size="12.5" fill="#64748b">Document the requirement in</text><text x="886.0" y="486.8" font-size="12.5" fill="#64748b">`CONTRIBUTING.md` and…</text><text x="886.0" y="501.3" font-size="11" fill="#4f46e5">AI · next step</text><circle cx="870" cy="521.2" r="8" fill="#22c55e"/><path d="M866.4,521.6 L869,524.2 L873.8,518.6" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="886.0" y="525.7" font-size="12.5" fill="#64748b">Check that `npm ci` rejects an</text><text x="886.0" y="540.7" font-size="12.5" fill="#64748b">unsupported Node version locally</text><text x="886.0" y="555.2" font-size="11" fill="#4f46e5">AI · next step</text><circle cx="870" cy="575.1" r="8" fill="#22c55e"/><path d="M866.4,575.5 L869,578.1 L873.8,572.5" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="886.0" y="579.6" font-size="12.5" fill="#64748b">Run `npm run lint`, `npm test`,</text><text x="886.0" y="594.6" font-size="12.5" fill="#64748b">`npm run conv` and the app build…</text><text x="886.0" y="609.1" font-size="11" fill="#4f46e5">AI · next step</text><text x="886.0" y="633.5" font-size="11" fill="#64748b">… (full text in the Markdown)</text>
<rect x="20.0" y="656.0" width="362.7" height="150" rx="16" fill="#0f172a" fill-opacity="0.025"/><rect x="20.0" y="654.0" width="362.7" height="150" rx="16" fill="#0f172a" fill-opacity="0.035"/><rect x="20.0" y="653.0" width="362.7" height="150" rx="16" fill="white"/><rect x="20.0" y="669.0" width="4" height="118" rx="2" fill="#d97706"/><circle cx="50.0" cy="680" r="13" fill="#fef3c7"/><text x="50.0" y="685.0" font-size="13" fill="#d97706" font-weight="bold" text-anchor="middle">7</text><text x="72.0" y="686.0" font-size="17" fill="#1e293b" font-weight="bold">Critical Success Factors</text><circle cx="43.0" cy="713.8" r="2.6" fill="#d97706"/><text x="53.0" y="717.0" font-size="10" fill="#1e293b">All dependencies (root and `app/`) install, lint, test</text><text x="53.0" y="731.0" font-size="10" fill="#1e293b">and build on the current LTS.</text><circle cx="43.0" cy="741.8" r="2.6" fill="#d97706"/><text x="53.0" y="745.0" font-size="10" fill="#1e293b">Local machines run Node 24 or newer; older versions are</text><text x="53.0" y="759.0" font-size="10" fill="#1e293b">rejected by `engine-strict`.</text><circle cx="43.0" cy="769.8" r="2.6" fill="#d97706"/><text x="53.0" y="773.0" font-size="10" fill="#1e293b">The deploy workflow stays green on the first release</text><text x="53.0" y="787.0" font-size="10" fill="#1e293b">after the change.</text>
<rect x="398.7" y="656.0" width="362.7" height="150" rx="16" fill="#0f172a" fill-opacity="0.025"/><rect x="398.7" y="654.0" width="362.7" height="150" rx="16" fill="#0f172a" fill-opacity="0.035"/><rect x="398.7" y="653.0" width="362.7" height="150" rx="16" fill="white"/><rect x="398.7" y="669.0" width="4" height="118" rx="2" fill="#0d9488"/><circle cx="428.7" cy="680" r="13" fill="#ccfbf1"/><text x="428.7" y="685.0" font-size="13" fill="#0d9488" font-weight="bold" text-anchor="middle">8</text><text x="450.7" y="686.0" font-size="17" fill="#1e293b" font-weight="bold">Resources</text><circle cx="421.7" cy="713.8" r="2.6" fill="#0d9488"/><text x="431.7" y="717.0" font-size="10" fill="#1e293b">Staff: AI implementation plus about 0.1 person-days for</text><text x="431.7" y="731.0" font-size="10" fill="#1e293b">owner review</text><circle cx="421.7" cy="741.8" r="2.6" fill="#0d9488"/><text x="431.7" y="745.0" font-size="10" fill="#1e293b">Costs: none (GitHub-hosted runners, free Node releases)</text><circle cx="421.7" cy="755.8" r="2.6" fill="#0d9488"/><text x="431.7" y="759.0" font-size="10" fill="#1e293b">Access: repository write access; CI result on the pull</text><text x="431.7" y="773.0" font-size="10" fill="#1e293b">request</text>
<rect x="777.3" y="656.0" width="362.7" height="150" rx="16" fill="#0f172a" fill-opacity="0.025"/><rect x="777.3" y="654.0" width="362.7" height="150" rx="16" fill="#0f172a" fill-opacity="0.035"/><rect x="777.3" y="653.0" width="362.7" height="150" rx="16" fill="white"/><rect x="777.3" y="669.0" width="4" height="118" rx="2" fill="#64748b"/><circle cx="807.3" cy="680" r="13" fill="#e2e8f0"/><text x="807.3" y="685.0" font-size="13" fill="#64748b" font-weight="bold" text-anchor="middle">11</text><text x="829.3" y="686.0" font-size="17" fill="#1e293b" font-weight="bold">Open Points</text><circle cx="800.3" cy="712.8" r="2.6" fill="#64748b"/><text x="810.3" y="717.0" font-size="13" fill="#1e293b">Node 24 LTS ends maintenance in April 2028;</text><text x="810.3" y="735.2" font-size="13" fill="#1e293b">plan the next bump before then (CI is</text><text x="810.3" y="753.4" font-size="13" fill="#1e293b">pinned to `24`, not `lts/*`).</text>
</svg>